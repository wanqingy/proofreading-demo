[project]
name = "proofreading-demo"
version = "0.1.0"
description = "Neuroglancer fly-through tooling for proofreading neuron skeletons"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipywidgets>=8.1.8",
    "neuroglancer>=2.41.2",
    "numpy>=2.4.4",
]

[project.optional-dependencies]
# SWC loading + tangent/quaternion orientation computation.
# (ac_ngl, the lab's helper module, is not on PyPI -- add it to sys.path.)
skeleton = ["navis"]
em = [
    "caveclient>=8.1.0",
    "cloud-volume>=12.13.1",
]
