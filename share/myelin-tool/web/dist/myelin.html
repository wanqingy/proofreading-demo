<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axon myelination fly-through</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      /* neuroglancer attaches here (makeMinimalViewer's default target id) */
      #neuroglancer-container {
        position: absolute;
        inset: 0;
      }
      #hud {
        position: absolute;
        bottom: 10px;
        right: 10px;
        z-index: 10000;
        background: rgba(0, 0, 0, 0.72);
        color: #d7e3ff;
        padding: 6px 8px;
        border: 1px solid #2c3a5a;
        border-radius: 8px;
        font-size: 11px;
        line-height: 1.3;
        /* The panel sits ON TOP of the EM you're judging, so it earns its width. max-width is the
           load-bearing one: without it a single long <option> or status string stretches the box
           across the viewport (a long scope label really did make it 1119px). Long strings wrap
           instead, and `anywhere` keeps an unbroken URL from overflowing the wrap. */
        min-width: 210px;
        max-width: 260px;
        overflow-wrap: anywhere;
        user-select: none;
      }
      #hud h1 {
        font-size: 10px;
        margin: 0 0 4px;
        color: #7fa8ff;
        letter-spacing: 0.04em;
      }
      #hud .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      #hud .v {
        color: #fff;
        font-variant-numeric: tabular-nums;
      }
      #hud .warn {
        color: #ff8a8a;
      }
      #hud .ok {
        color: #8aff9c;
      }
      #hud .controls {
        margin-top: 5px;
        border-top: 1px solid #2c3a5a;
        padding-top: 5px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }
      #hud button {
        background: #1c2740;
        color: #d7e3ff;
        border: 1px solid #3a4d78;
        border-radius: 5px;
        padding: 2px 6px;
        cursor: pointer;
        font: inherit;
      }
      /* The key legend is reference material you need once, not every frame -- collapsed by
         default so it costs one line instead of seven, and still one click away. */
      #hud details summary {
        cursor: pointer;
        color: #7f8db0;
        margin-top: 4px;
      }
      #hud button:hover {
        background: #28365a;
      }
      #hud label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #hud input[type="range"] {
        width: 74px;
      }
      #status {
        margin-top: 4px;
        color: #9fb0d0;
        font-size: 10px;
      }
    </style>
    <script type="module" crossorigin src="/assets/myelin-C0qmmqpE.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/myelin-C9CTwhEK.css">
  </head>
  <body>
    <div id="neuroglancer-container"></div>
    <div id="hud">
      <h1>AXON MYELINATION</h1>
      <div class="row" style="margin-bottom: 4px; gap: 4px">
        <input
          id="cellid"
          placeholder="root id"
          style="flex: 1; min-width: 0; background: #1c2740; color: #d7e3ff; border: 1px solid #3a4d78; border-radius: 5px; padding: 2px; font: inherit"
        />
        <button id="loadcell">load</button>
      </div>
      <!-- what to annotate: the axon only (the default, and what every log written before this
           existed was reviewed as) or the whole skeleton. Recorded per cell, so reopening resumes
           the same scope. Option labels stay SHORT: they set the width of the whole panel, and the
           cache caveat lives in the tooltip and the README instead. -->
      <div class="row" style="margin-bottom: 4px; gap: 4px">
        <select
          id="scope"
          title="which part of the skeleton to annotate (recorded per cell). whole skeleton is 1.6-1.9x the path length, so it caches proportionally more EM"
          style="flex: 1; min-width: 0; background: #1c2740; color: #d7e3ff; border: 1px solid #3a4d78; border-radius: 5px; padding: 2px; font: inherit"
        >
          <option value="axon">axon only</option>
          <option value="all">whole skeleton</option>
        </select>
      </div>
      <div class="row" style="margin-bottom: 4px">
        <select
          id="branch"
          style="width: 100%; background: #1c2740; color: #d7e3ff; border: 1px solid #3a4d78; border-radius: 5px; padding: 2px; font: inherit"
        ></select>
      </div>
      <div class="row" style="margin-bottom: 3px; color: #9fb0d0; font-size: 10px">
        <span id="coverage">&mdash;</span>
        <span id="celldonebadge" class="ok" style="display: none; font-weight: bold">CELL DONE</span>
      </div>
      <div class="row"><span>progress</span><span class="v" id="progresspct">0%</span></div>
      <div class="row" style="margin-bottom: 3px">
        <input type="range" id="progress" min="0" max="1000" value="0" style="width: 100%" />
      </div>
      <!-- paint state and buffer depth share one line: both are transient, both are usually empty,
           and two reserved-but-blank rows cost more space than they earn. min-height is kept so the
           panel doesn't jump every time one of them appears mid-flight.
           bufdepth = loaded EM ahead of the camera; it turns red with the applied slowdown when the
           fly-through is being held back waiting for chunks. -->
      <div class="row" style="margin-bottom: 3px; min-height: 13px; font-size: 10px; gap: 6px">
        <span id="paintstate" style="font-weight: bold"></span>
        <span id="bufdepth"></span>
      </div>
      <!-- live tube-caching progress: a moving bar means the fetch is alive; it turns red and
           says STALLED when no chunk has landed for a while (wedged GCS read). -->
      <div style="margin-bottom: 4px">
        <div
          id="warmbar"
          style="display: none; height: 4px; background: #1c2740; border-radius: 2px; overflow: hidden"
        >
          <div id="warmfill" style="height: 100%; width: 0%; background: #7fa8ff; transition: width 0.3s"></div>
        </div>
        <div id="warmlabel" style="color: #7f8db0; font-size: 10px; margin-top: 2px"></div>
      </div>
      <div class="controls">
        <button id="toggle">pause cam</button>
        <button id="markdone">branch done (x)</button>
        <button id="celldone">cell done</button>
        <label>speed <input type="range" id="speed" min="200" max="6000" step="100" value="1000" /></label>
      </div>
      <details id="legendbox">
        <summary>keys &amp; colours</summary>
        <!-- Deliberately terse. This wraps inside a ~260px panel, so the prose that used to live
             here (what "cell done" and "scope" mean) would make the panel TALLER opened than the
             whole thing was before. Both are labelled buttons with tooltips, and the README covers
             them properly -- a HUD legend is for the keys you can't see. -->
        <div id="legend" style="color: #7f8db0; font-size: 10px">
          <b style="color: #d7e3ff">space</b> play/pause &middot;
          <b style="color: #d7e3ff">x</b> branch done + advance<br />
          <b style="color: #33ff99">t</b> tag myelinated &middot;
          <b style="color: #ff5566">d</b> delete nearest &middot;
          <b style="color: #ff8a8a">p</b> paint while flying<br />
          <b style="color: #33ff99">green</b> tags &middot;
          <b style="color: #cc66ff">magenta</b> branch points &middot;
          <b style="color: #ffffff">white</b> tips
        </div>
      </details>
      <div id="crashnotice" class="warn" style="display: none; margin-top: 4px; font-size: 10px"></div>
      <!-- sticky, non-fatal notices (historical root, empty mask). Separate from #status, which the
           next branch load overwrites, and from #crashnotice, which is about the previous session. -->
      <div id="notice" class="warn" style="display: none; margin-top: 4px; font-size: 10px"></div>
      <div id="status">connecting...</div>
    </div>
    <!-- surface ANY runtime error (incl. module-eval errors that fire before myelin.ts runs)
         onto the panel, so we don't need DevTools to diagnose it. -->
    <script>
      function __myelinErr(msg) {
        var s = document.getElementById("status");
        if (s) {
          s.textContent = "ERR: " + msg;
          s.className = "warn";
        }
      }
      window.addEventListener("error", function (e) {
        __myelinErr(
          (e.message || e.error) +
            (e.filename ? " @ " + String(e.filename).split("/").pop() + ":" + e.lineno : ""),
        );
        console.error("[myelin] error", e.error || e.message);
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        __myelinErr("promise: " + (r && (r.stack || r.message || r)));
        console.error("[myelin] unhandledrejection", r);
      });
    </script>
  </body>
</html>
